# vim:fileencoding=utf-8:foldmethod=marker

# POLICE

# Police principale utilisée dans le terminal (famille de la police)
font_family     JetBrainsMono Nerd Font Mono 

# Taille de la police, en points
font_size 15.0


# CURSEUR

# Durée (en ms) de la traînée animée laissée par le curseur quand il se déplace
cursor_trail 200

# Vitesse de disparition de la traînée : (délai avant début de la décroissance, durée de la décroissance)
cursor_trail_decay 0.1 0.4

# Distance minimale (en cellules) que le curseur doit parcourir avant que la traînée apparaisse
cursor_trail_start_threshold 2


# SCROLLBACK / SOURIS

# Nombre de lignes conservées dans l'historique de défilement (scrollback)
scrollback_lines 10000

# Taille (en Mo) de l'historique supplémentaire transmis à un pager externe (ex: less)
scrollback_pager_history_size 10

# Délai avant de cacher le curseur de la souris (valeur négative = le cacher dès que tu tapes du texte)
mouse_hide_wait -5.0


# FENÊTRE

# Ne pas se souvenir de la taille de fenêtre entre les sessions (toujours utiliser initial_window_width/height)
remember_window_size  yes

# Largeur initiale de la fenêtre
# initial_window_width  1366

# Hauteur initiale de la fenêtre
# initial_window_height 768

# Marge interne (padding) entre le bord de la fenêtre et le contenu du terminal, en pts (horizontal, vertical)
window_padding_width 10 10

# Cacher les décorations de la fenêtre (barre de titre, bordures du gestionnaire de fenêtres)
hide_window_decorations yes


# BARRE D'ONGLETS

# Position de la barre d'onglets (top ou bottom)
tab_bar_edge bottom

# Marge autour de la barre d'onglets, en pts
tab_bar_margin_width 4.0

# Style visuel "powerline" pour la forme des onglets (round, slanted, angled...)
tab_powerline_style round


# COULEURS / THÈME
# -> Ces lignes sont commentées car elles sont maintenant gérées par
#    kitty +kitten themes via le bloc BEGIN_KITTY_THEME plus bas.
#    Décommente-les uniquement si tu veux revenir à des couleurs manuelles.

background_opacity 0.7
background_blur 10
# foreground #CBE0F0
# background #00111E
# cursor #47FF9C
# cursor_text_color #011423
# selection_foreground #CBE0F0
# selection_background #033259
# color0  #214969
# color1  #E52E2E
# color2  #44FFB1
