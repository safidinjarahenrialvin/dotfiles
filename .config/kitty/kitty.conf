# color10 #44FFB1
# color11 #FFE073
# color12 #A277FF
# color13 #a277ff
# color14 #24EAF7
# color15 #24EAF7


# NOTIFICATIONS

# Notifier quand une commande se termine, seulement si la fenêtre n'a pas le focus ("invisible"), et si elle a duré au moins 20 secondes
notify_on_cmd_finish invisible 20


# BEGIN_KITTY_THEME
# Dainty Dark
include current-theme.conf
# END_KITTY_THEME
